name: One-time dependency cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.ref == 'refs/heads/security/harden-twilio-api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/harden-twilio-api

      - name: Remove committed dependency tree and this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch -- node_modules
          git rm --ignore-unmatch .github/workflows/dependency-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove committed dependency tree"
          git push origin HEAD:security/harden-twilio-api
